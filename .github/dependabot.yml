version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    # React Native pins its own toolchain; a lone bump of these breaks the build
    # or the app at start, so React Native itself moves only whole, and the shared
    # toolchain takes patches and minors but not majors.
    ignore:
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: react-test-renderer
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/cli*"
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: jest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: prettier
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
